# Fly.io config for the RAG chatbot backend.
# Run `fly deploy` from this `backend/` directory (change `app` to a unique name).
# Create the volume first:  fly volumes create chroma_data --region iad --size 1
# Set secrets with:  fly secrets set ANTHROPIC_API_KEY=... APP_API_KEY=...

app = "rag-chatbot-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[mounts]
  source = "chroma_data"
  destination = "/chroma_data"
