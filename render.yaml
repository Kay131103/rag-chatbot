# Render Blueprint — RAG chatbot backend.
# Free-tier friendly: ChromaDB lives in /tmp (ephemeral), so uploaded documents
# reset when the free instance sleeps and cold-starts. Perfect for a live demo.
# For a persistent index, restore the disk + starter plan and set CHROMA_PATH=/chroma_data.
services:
  - type: web
    name: rag-chatbot-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      # Google retired gemini-2.5-flash for new API users (Nov 2026)
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_API_KEY
        sync: false
      - key: CHROMA_PATH
        value: /tmp/chroma_data
      - key: CORS_ORIGINS
        value: '["https://rag-chatbot-6ii.pages.dev"]'
